server {
    listen 80;
    server_name localhost;  # 替换为你的域名

    # 根目录指向构建输出的 dist 目录
    root /path/to/your/dist;  # 需要替换为实际的 dist 目录路径
    index index.html;

    # 设置适当的 MIME 类型
    location ~* \.html$ {
        expires 1m;
        add_header Cache-Control "public, must-revalidate";
    }

    # 静态资源缓存策略
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # 确保 JS 文件以正确的 MIME 类型提供
        if ($request_filename ~* \.js$) {
            add_header Content-Type application/javascript;
        }
        if ($request_filename ~* \.css$) {
            add_header Content-Type text/css;
        }
    }

    # 图片资源
    location ~* \.(png|jpe?g|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 字体资源
    location ~* \.(woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # manifest.json 文件
    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public";
        add_header Content-Type application/json;
        try_files $uri $uri/ =404;
    }

    # manifest.webmanifest 文件
    location = /manifest.webmanifest {
        expires 1d;
        add_header Cache-Control "public";
        add_header Content-Type application/manifest+json;
        try_files $uri $uri/ =404;
    }

    # Service Worker
    location = /sw.js {
        expires 1m;
        add_header Cache-Control "public, must-revalidate";
        add_header Content-Type application/javascript;
        add_header Service-Worker-Allowed "/";
        try_files $uri $uri/ =404;
    }

    # Register SW
    location = /registerSW.js {
        expires 1m;
        add_header Cache-Control "public, must-revalidate";
        add_header Content-Type application/javascript;
        try_files $uri $uri/ =404;
    }

    # API 接口（如果有的话）
    location ^~ /api/ {
        proxy_pass http://your-api-server;  # 替换为你的 API 服务器
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其他静态资源
    location ~* \.(xml|txt|csv|rss|atom)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # 主路由 - 所有非文件请求都返回 index.html
    location / {
        try_files $uri $uri/ @fallback;
    }

    # SPA 路由回退
    location @fallback {
        rewrite ^.*$ /index.html last;
    }

    # 错误页面
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}